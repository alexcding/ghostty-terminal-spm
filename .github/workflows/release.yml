name: Release
# Dispatch with a tag like 1.6.20260922-cascade.2. The job builds the pinned
# Ghostty from source, points Package.swift at this build's XCFramework with its
# checksum, commits, tags that commit and publishes the same artifacts. The build
# is not byte-reproducible, so the manifest must come from the build it ships.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, <ghostty package version>-cascade.<n>"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag
        run: |
          echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-cascade\.[0-9]+$' || { echo "[!] bad tag: $TAG"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "[!] tag already exists: $TAG"; exit 1
          fi
      - name: Build artifacts
        run: Script/cascade-release.sh
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release/*.zip
      - name: Point the manifest at this build
        run: |
          CHECKSUM=$(swift package compute-checksum build/release/GhosttyKit.xcframework.zip)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/GhosttyKit.xcframework.zip"
          perl -0pi -e "s|url: \"[^\"]*/GhosttyKit\.xcframework\.zip\",\s*checksum: \"[0-9a-f]{64}\"|url: \"$URL\",\n            checksum: \"$CHECKSUM\"|" Package.swift
          grep -q "$CHECKSUM" Package.swift && grep -q "$URL" Package.swift
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
      - name: Commit, tag and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "release: ${TAG}"
          git tag "$TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${TAG}"
          gh release create "$TAG" build/release/GhosttyKit.xcframework.zip build/release/ghostty-vt-runtime.zip \
            --verify-tag --title "$TAG" --notes "GhosttyKit.xcframework.zip checksum: ${CHECKSUM}"
      - name: Verify the published binary matches the manifest
        run: |
          rm -rf verify && mkdir verify
          gh release download "$TAG" --pattern GhosttyKit.xcframework.zip --dir verify
          PUBLISHED=$(swift package compute-checksum verify/GhosttyKit.xcframework.zip)
          git show "$TAG:Package.swift" | grep -q "checksum: \"$PUBLISHED\"" || { echo "[!] published $PUBLISHED is not in $TAG's manifest"; exit 1; }
          echo "[+] $TAG manifest matches its release ($PUBLISHED)"
