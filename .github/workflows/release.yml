name: Release
# Pushing a tag like 1.6.20260909-taskhub.2 builds the pinned Ghostty from source
# and attaches the artifacts to a GitHub release of that tag. Update the
# binaryTarget checksum in Package.swift from the job output afterwards.
on:
  push:
    tags: ["*-taskhub.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build artifacts
        run: Script/taskhub-release.sh
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHECKSUM=$(swift package compute-checksum build/release/GhosttyKit.xcframework.zip)
          gh release create "${GITHUB_REF_NAME}" build/release/GhosttyKit.xcframework.zip build/release/ghostty-vt-runtime.zip \
            --title "${GITHUB_REF_NAME}" --notes "GhosttyKit.xcframework.zip checksum: ${CHECKSUM}"
